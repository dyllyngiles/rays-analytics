name: Publish dbt docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate dbt docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install UV — pinned to exact version for supply chain security
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # Same pattern as ci.yml: no ~/.dbt/ dir in CI, private_key passed
      # inline from the secret, no key file written. PROD schema — docs
      # should reflect what's actually live, same source dbt build uses.
      - name: Generate profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << PROFILE
          rays_analytics:
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key: "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}"
                role: SYSADMIN
                database: RAYS_ANALYTICS
                warehouse: COMPUTE_WH
                schema: PROD
                threads: 4
            target: dev
          PROFILE

      - name: Run dbt deps
        run: |
          source ../.venv/bin/activate
          dbt deps
        working-directory: rays_analytics

      # docs generate needs a manifest, so run it after a real build rather
      # than against stale artifacts. This is the same build ci.yml's
      # push job already does — cheap at 4 models, keeps this workflow
      # self-contained instead of depending on ci.yml's run.
      - name: dbt build then generate docs
        run: |
          source ../.venv/bin/activate
          dbt build
          dbt docs generate
        working-directory: rays_analytics

      # Stage an explicit file list rather than publishing all of target/,
      # which also holds compiled SQL, run_results, and partial_parse. Same
      # reasoning as publish_docs.sh's explicit `git add` list: only ship
      # what the docs site actually serves.
      - name: Stage docs site
        run: |
          mkdir -p ../docs-site
          cd target
          cp index.html manifest.json catalog.json ../../docs-site/
        working-directory: rays_analytics

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
