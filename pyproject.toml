[project]
name = "rays-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb",
    "dbt-snowflake==1.11.4",
    "dlt[duckdb,snowflake]>=1.28.1",
    "marimo>=0.23.16",
    "requests",
]

[tool.uv.audit]
ignore = [
    "GHSA-3496-9g83-7v6x",
    "GHSA-f2ff-p2ww-7p4p",
    "GHSA-pwgv-4x5q-6m9f",
    "GHSA-prg7-hcfm-mfcr",
]
# sqlparse<0.6.0 pinned by dbt-core (no release allows 0.6.0+ yet).
# dbt-core only compiles trusted, project-generated SQL, so the underlying
# DoS/ReDoS vectors don't apply to this pipeline's threat model.
# Tracking: https://github.com/dbt-labs/dbt-core/issues/12329
